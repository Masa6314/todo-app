services:
  demo-app:
    build: ./todo_backend
    volumes:
      - ./todo_backend:/src/backend
    ports:
      - 8000:8000  # ホストマシンのポート8000を、docker内のポート8000に接続する
    # depends_on:
    #   - db  # バックエンドはDBサービスが起動してから起動する
  db:
    image: mysql:8.0
    platform: linux/x86_64  # M1 Macの場合必要
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'  # rootアカウントをパスワードなしで作成
      MYSQL_DATABASE: 'demo'  # 初期データベースとしてdemoを設定
      TZ: 'Asia/Tokyo'  # タイムゾーンを日本時間に設定
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password  # MySQL8.0ではデフォルトが"caching_sha2_password"で、ドライバが非対応のため変更
    ports:
      - 33306:3306  # ホストマシンのポート33306を、docker内のポート3306に接続する

  app:
    build:
      context: ./todo_frontend
      dockerfile: Dockerfile
    volumes:
    - type: bind
      source: ./todo_frontend
      target: /usr/src/frontend
    #"react-app"の部分がプロジェクト名になる
    command: sh -c "cd react-app && yarn start" 
    ports:
      - 3000:3000
    stdin_open: true #標準入力をコンテナと紐付ける
    # depends_on:
    #   - demo-app  # フロントエンドはバックエンドサービスが起動してから起動する

volumes:
  mysql_data: